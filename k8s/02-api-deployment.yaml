apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-modelos-deployment
  namespace: plastiktrack
  labels:
    app: api-modelos
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-modelos
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: api-modelos
        tier: backend
    spec:
      containers:
        - name: api-modelos
          image: ghcr.io/benjamin-benoni-santos-ojeda/plastiktrack-api:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: plastiktrack-config
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "600m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 2
