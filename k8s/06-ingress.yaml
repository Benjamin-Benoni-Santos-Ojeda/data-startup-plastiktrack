apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: plastiktrack-ingress
  namespace: plastiktrack
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
spec:
  rules:
    - http:
        paths:
          # Ruta al Tablero Streamlit
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tablero-service
                port:
                  number: 8501
          # Rutas a la API de Inferencia y Documentación OpenAPI
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: api-service
                port:
                  number: 8000
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: api-service
                port:
                  number: 8000
          - path: /health
            pathType: Exact
            backend:
              service:
                name: api-service
                port:
                  number: 8000
